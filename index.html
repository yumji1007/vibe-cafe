<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <!-- 화면 모양을 꾸밀 CSS 파일을 연결합니다. -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase 라이브러리를 먼저 불러와 주문 저장 기능에서 사용할 수 있게 합니다. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <!-- 주문 계산 기능을 담당할 JavaScript 파일을 연결합니다. -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- 카페 로고와 이름, 소개 문구를 보여줍니다. -->
  <header>
    <h1><span aria-hidden="true">☕</span><br>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- novalidate를 사용해 이름 검사는 나중에 JavaScript로 처리합니다. -->
  <main>
    <!-- 버튼으로 주문서와 주문 내역 화면을 바꿉니다. -->
    <nav class="tab-menu" role="tablist" aria-label="주문 메뉴">
      <button type="button" class="tab-button active" id="order-tab" role="tab" aria-selected="true" aria-controls="order-panel">☕ 주문하기</button>
      <button type="button" class="tab-button" id="orders-tab" role="tab" aria-selected="false" aria-controls="orders-panel">
        <span>📋 주문 내역</span>
        <span class="order-count-badge" id="order-count">0</span>
      </button>
    </nav>

    <!-- 주문서와 주문 확인 메시지를 담는 탭 화면입니다. -->
    <section id="order-panel" role="tabpanel" aria-labelledby="order-tab" tabindex="0">
      <form id="order-form" novalidate>
      <!-- 주문할 사람의 이름과 전화번호를 입력합니다. -->
      <div>
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" required>
      </div>

      <div>
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customerPhone">
      </div>

      <!-- 음료 가격은 data-price 값으로 저장합니다. -->
      <div>
        <label for="drink">음료 선택</label>
        <select id="drink" name="drink">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="아메리카노" data-price="3500">아메리카노 3,500원</option>
          <option value="카페라떼" data-price="4000">카페라떼 4,000원</option>
          <option value="카페모카" data-price="4500">카페모카 4,500원</option>
          <option value="바닐라라떼" data-price="4500">바닐라라떼 4,500원</option>
          <option value="녹차라떼" data-price="4500">녹차라떼 4,500원</option>
        </select>
      </div>

      <!-- 라디오 버튼으로 한 가지 사이즈를 선택합니다. -->
      <fieldset>
        <legend>사이즈</legend>
        <input type="radio" id="size-small" name="size" value="S" data-price="0">
        <label for="size-small">S +0원</label>

        <input type="radio" id="size-medium" name="size" value="M" data-price="500" checked>
        <label for="size-medium">M +500원</label>

        <input type="radio" id="size-large" name="size" value="L" data-price="1000">
        <label for="size-large">L +1,000원</label>
      </fieldset>

      <!-- 체크박스로 원하는 추가 옵션을 여러 개 선택합니다. -->
      <fieldset>
        <legend>추가 옵션</legend>
        <input type="checkbox" id="extra-shot" name="options" value="샷 추가" data-price="500">
        <label for="extra-shot">샷 추가 +500원</label>

        <input type="checkbox" id="extra-cream" name="options" value="크림 추가" data-price="500">
        <label for="extra-cream">크림 추가 +500원</label>

        <input type="checkbox" id="extra-syrup" name="options" value="시럽 추가" data-price="300">
        <label for="extra-syrup">시럽 추가 +300원</label>

        <input type="checkbox" id="extra-decaf" name="options" value="디카페인" data-price="0">
        <label for="extra-decaf">디카페인 +0원</label>
      </fieldset>

      <!-- 주문할 음료의 개수를 입력합니다. -->
      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 카페에 전달할 요청사항을 입력합니다. -->
      <div>
        <label for="request">요청사항</label>
        <textarea id="request" name="request"></textarea>
      </div>

      <!-- JavaScript가 예상 금액을 표시할 영역입니다. -->
      <p id="estimated-price" aria-live="polite">예상 금액: 0원</p>

      <!-- 주문을 제출하거나 입력 내용을 다시 작성합니다. -->
      <button type="submit">주문하기</button>
      <button type="reset">다시 작성</button>

      <!-- 주문이 완료되면 JavaScript가 확인 메시지를 표시합니다. -->
      <p id="order-confirmation" role="status" hidden></p>
      </form>
    </section>

    <!-- 접수된 주문 목록을 보여주는 탭 화면입니다. -->
    <section id="orders-panel" class="hidden" role="tabpanel" aria-labelledby="orders-tab" tabindex="0">
      <h2>주문 내역</h2>
      <p id="empty-orders">아직 주문 내역이 없어요 ☕</p>
      <div id="orders-list" aria-live="polite"></div>
      <div id="orders-summary" class="hidden">
        <p id="orders-total"></p>
        <button type="button" id="clear-orders">내역 모두 지우기</button>
      </div>
    </section>
  </main>
</body>
</html>
